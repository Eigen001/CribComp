<!-- ===== screens-shared.jsx ===== -->
<script type="text/babel" data-src="screens-shared.jsx">
/* ============================================================
   SHARED — board geometry, phone wrapper, game state, glyphs
   Used by all three redesign directions.
   ============================================================ */

/* The single demo game shown across every mockup, so the three
   directions are comparing the same moment of play. */
const GAME = {
  round: 9,
  target: 121,
  // dealer + crib belong to June this hand
  dealer: 0,
  players: [
    { name: 'June',  color: '#C0492E', score: 91, back: 83 }, // front peg 91, back 83
    { name: 'Theo',  color: '#2E6E9E', score: 84, back: 80 },
  ],
};

const SUITS = '\u2660 \u2665 \u2666 \u2663'; // ♠ ♥ ♦ ♣

/* ------------------------------------------------------------
   computeSnake — classic snaking peg track.
   Rows stacked bottom→top, each a street of `perRow` holes that
   alternates direction, with an extra gap every `groupEvery`
   holes (the felt-and-brass "groups of five" cadence).
   Returns geometry + a pos(track, score) helper.
   ------------------------------------------------------------ */
function computeSnake(W, H, opts) {
  const o = Object.assign({
    pad: 16, rows: 12, perRow: 10, tracks: 2, target: 121,
    trackGap: 7, groupEvery: 5, groupGapFrac: 0.9,
    capH: 26,                 // reserved space top (win) + bottom (start)
  }, opts);
  const pad = o.pad;
  const playTop = pad + o.capH;
  const playBot = H - pad - o.capH;
  const bandH = (playBot - playTop) / o.rows;
  const x0 = pad, x1 = W - pad;

  function rowXs() {
    const n = o.perRow;
    const gaps = Math.floor((n - 1) / o.groupEvery);
    const span = x1 - x0;
    const slot = span / ((n - 1) + gaps * o.groupGapFrac);
    const xs = []; let x = x0;
    for (let i = 0; i < n; i++) {
      xs.push(x);
      let step = slot;
      if ((i + 1) % o.groupEvery === 0 && i < n - 1) step += slot * o.groupGapFrac;
      x += step;
    }
    return xs;
  }
  const baseXs = rowXs();

  // tracks[t][score] = {x,y}; score 0..121
  const tracks = [];
  for (let t = 0; t < o.tracks; t++) {
    const off = (t - (o.tracks - 1) / 2) * o.trackGap;
    const arr = new Array(o.target + 1);
    // start hole (0) below the first row
    arr[0] = { x: x0 - 2, y: playBot + o.capH * 0.5 + off };
    for (let h = 1; h <= 120; h++) {
      const row = Math.floor((h - 1) / o.perRow);
      const pos = (h - 1) % o.perRow;
      const ltr = row % 2 === 0;
      const cy = playBot - (row + 0.5) * bandH + off;
      const xi = ltr ? pos : (o.perRow - 1 - pos);
      arr[h] = { x: baseXs[xi], y: cy };
    }
    // win hole (121) above the top row
    arr[121] = { x: x1 + 2, y: playTop - o.capH * 0.5 + off };
    tracks.push(arr);
  }

  // all hole dots for one track (for drawing the drilled holes)
  function holeList(t) {
    const out = [];
    for (let h = 1; h <= 120; h++) out.push(tracks[t][h]);
    return out;
  }

  return { tracks, holeList, bandH, playTop, playBot, pad,
           pos: (t, s) => tracks[t][Math.max(0, Math.min(121, s))] };
}

/* ------------------------------------------------------------
   PhoneScreen — full-bleed screen body inside the iOS frame.
   Clears the status bar / dynamic island, fills the device.
   ------------------------------------------------------------ */
function PhoneScreen({ bg, children, padTop = 'max(18px, env(safe-area-inset-top))', style = {} }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, background: bg,
      display: 'flex', flexDirection: 'column',
      paddingTop: padTop,
      overflow: 'hidden',
      ...style,
    }}>
      {children}
    </div>
  );
}

/* tiny suit row */
function SuitRow({ size = 13, color, gap = 7, style = {} }) {
  return (
    <div style={{
      display: 'flex', gap, fontSize: size, color,
      fontFamily: "'Cormorant Garamond', serif", lineHeight: 1, ...style,
    }}>
      <span>{'\u2660'}</span><span>{'\u2665'}</span>
      <span>{'\u2666'}</span><span>{'\u2663'}</span>
    </div>
  );
}

/* a single peg shape (rounded golf-tee dot) */
function Peg({ cx, cy, r, color, glow = false }) {
  return (
    <g>
      {glow && <circle cx={cx} cy={cy} r={r * 2.4} fill={color} opacity="0.22" />}
      <circle cx={cx} cy={cy + r * 0.45} r={r} fill="rgba(0,0,0,0.28)" />
      <circle cx={cx} cy={cy} r={r} fill={color} />
      <circle cx={cx - r * 0.32} cy={cy - r * 0.34} r={r * 0.38} fill="#fff" opacity="0.55" />
    </g>
  );
}

Object.assign(window, { GAME, SUITS, computeSnake, PhoneScreen, SuitRow, Peg });

</script>
<!-- ===== switchback-board.jsx ===== -->
<script type="text/babel" data-src="switchback-board.jsx">
/* ============================================================
   SWITCHBACK CLIMB — redesign option D, wired to live game state.
   A paper trail-map: one shared switchback path climbing to 121.
   Each player is a pin with a flag (name + live score). A faint
   "ghost" peg marks where the pin sat before the last +/- change.
   The dotted trail markers ("holes") are enlarged for visibility.
   Parameterized by width/height so it scales into the app screen.
   ============================================================ */

function _sbDark(hex, amt) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const m = (v) => Math.round(v * (1 - amt)).toString(16).padStart(2, '0');
  return '#' + m(r) + m(g) + m(b);
}

/* continuous position along the switchback for a given score (0..121) */
function sbPos(score, cfg) {
  const { legs, x0, x1, yBot, band, perLeg } = cfg;
  const idx = Math.max(0, Math.min(121, score));
  const leg = Math.min(legs - 1, Math.floor(idx / perLeg));
  const within = (idx - leg * perLeg) / perLeg;
  const lr = leg % 2 === 0;
  const tx = lr ? within : 1 - within;
  return { x: x0 + tx * (x1 - x0), y: yBot - leg * band };
}

function sbPath(cfg) {
  const { legs, x0, x1, yBot, band, curve } = cfg;
  let d = '';
  for (let r = 0; r < legs; r++) {
    const y = yBot - r * band;
    const lr = r % 2 === 0;
    const sx = lr ? x0 : x1, ex = lr ? x1 : x0;
    if (r === 0) d += `M ${sx} ${y} `;
    else {
      const py = yBot - (r - 1) * band;
      const bx = lr ? -1 : 1;
      d += `C ${sx + bx * curve} ${py} ${sx + bx * curve} ${y} ${sx} ${y} `;
    }
    d += `L ${ex} ${y} `;
  }
  return d;
}

/* player's main peg, capping the flag pole */
function SBPeg({ x, y, r, color, glow }) {
  return (
    <g>
      {glow && <circle cx={x} cy={y} r={r * 2.1} fill={color} opacity="0.22" />}
      <circle cx={x} cy={y + r * 0.42} r={r} fill="rgba(20,12,4,0.32)" />
      <circle cx={x} cy={y} r={r} fill={color} />
      <circle cx={x} cy={y} r={r} fill="none" stroke={_sbDark(color, 0.32)} strokeWidth={Math.max(0.8, r * 0.16)} />
      <circle cx={x - r * 0.3} cy={y - r * 0.34} r={r * 0.34} fill="#fff" opacity="0.6" />
    </g>
  );
}

/* faint marker of where the pin sat before the last point change */
function SBGhost({ x, y, r, color }) {
  return (
    <g opacity="0.62">
      <circle cx={x} cy={y} r={r} fill={color} opacity="0.16" />
      <circle cx={x} cy={y} r={r} fill="none" stroke={color} strokeWidth={Math.max(1.1, r * 0.3)}
        strokeDasharray={`${r * 0.46} ${r * 0.4}`} strokeLinecap="round" />
    </g>
  );
}

/* the climbing pin: pole + name/score flag, peg at the trail point */
function SBPinFlag({ x, y, color, name, score, dir, k }) {
  const stem = 16 * k;
  const fw = 64 * k, fh = 30 * k;
  const fy = dir < 0 ? y - (stem + fh) : y + stem;
  const label = (name || '').toUpperCase().slice(0, 9);
  return (
    <g>
      <line x1={x} y1={y} x2={x} y2={dir < 0 ? y - stem : y + stem}
        stroke={_sbDark(color, 0.3)} strokeWidth={2 * k} />
      <g transform={`translate(${x - fw / 2} ${fy})`}>
        <rect width={fw} height={fh} rx={8 * k} fill={color} />
        <rect width={fw} height={fh * 0.5} rx={8 * k} fill="#fff" opacity="0.13" />
        <text x={fw / 2} y={fh * 0.4} textAnchor="middle" fontFamily="'Hanken Grotesk',sans-serif"
          fontWeight="700" fontSize={7.6 * k} letterSpacing={k} fill="#fff" opacity="0.94">{label}</text>
        <text x={fw / 2} y={fh * 0.85} textAnchor="middle" fontFamily="'Cormorant Garamond',serif"
          fontWeight="700" fontSize={15 * k} fill="#fff">{score}</text>
      </g>
      <SBPeg x={x} y={y} r={7.5 * k} color={color} />
    </g>
  );
}

function SwitchbackBoard({ t, players, w = 300, h = 440 }) {
  const n = Math.min(3, players.length);
  const k = w / 384;                       // scale vs. the original design width
  const legs = 6, perLeg = 121 / legs;
  const x0 = 56 * k, x1 = w - 56 * k;
  const yBot = h - 66 * k, yTop = 58 * k;
  const band = (yBot - yTop) / (legs - 1);
  const cfg = { legs, perLeg, x0, x1, yBot, band, curve: 40 * k };
  const camps = [30, 60, 90];
  const dirs = n === 3 ? [-1, 1, -1] : [-1, 1];
  const nudge = (n === 3 ? [-17, 0, 17] : [-13, 13]).map((v) => v * k);

  const trailW = 22 * k;
  const woodCol = t.dark ? '#4A3A22' : t.frame;
  const uid = t.key;
  const d = sbPath(cfg);

  return (
    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`sbpaper-${uid}`} x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stopColor={t.surfaceAlt} /><stop offset="1" stopColor={t.accentSoft} />
        </linearGradient>
      </defs>

      {/* paper map panel */}
      <rect x={4 * k} y={4 * k} width={w - 8 * k} height={h - 8 * k} rx={22 * k}
        fill={`url(#sbpaper-${uid})`} stroke={t.hairline} strokeWidth="1" />

      {/* summit label */}
      <text x={x0} y={yTop - 18 * k} textAnchor="middle" fontFamily="'Hanken Grotesk',sans-serif"
        fontWeight="700" fontSize={10 * k} letterSpacing={2.5 * k} fill={t.accent}>121 ▲</text>

      {/* trail: shadow casing → wood path → enlarged dotted holes */}
      <path d={d} fill="none" stroke={t.laneShade} strokeWidth={trailW + 4 * k}
        strokeLinecap="round" strokeLinejoin="round" />
      <path d={d} fill="none" stroke={woodCol} strokeWidth={trailW}
        strokeLinecap="round" strokeLinejoin="round" />
      <path d={d} fill="none" stroke="#fff" strokeOpacity={t.dark ? 0.5 : 0.62}
        strokeWidth={4.6 * k} strokeDasharray={`${0.6 * k} ${13 * k}`} strokeLinecap="round" />

      {/* camps / milestones, incl. skunk (90) and double-skunk (60) lines */}
      {camps.map((s) => {
        const p = sbPos(s, cfg);
        const skunk = s === 90;       // reach 91 to avoid a skunk
        const dbl = s === 60;         // reach 61 to avoid a double skunk
        const mark = skunk || dbl;
        return (
          <g key={s}>
            <circle cx={p.x} cy={p.y} r={13 * k} fill={t.surface}
              stroke={mark ? t.cols[0] : t.frameEdge} strokeWidth={mark ? 2 * k : 1.4 * k}
              strokeDasharray={mark ? `${3 * k} ${3 * k}` : 'none'} />
            <text x={p.x} y={p.y + 4 * k} textAnchor="middle" fontFamily="'Hanken Grotesk',sans-serif"
              fontWeight="700" fontSize={10 * k} fill={mark ? t.cols[0] : t.ink2}>{s}</text>
            {mark && <text x={p.x} y={p.y - 19 * k} textAnchor="middle"
              fontFamily="'Hanken Grotesk',sans-serif" fontWeight="700" fontSize={7 * k}
              letterSpacing={1.5 * k} fill={t.cols[0]}>{skunk ? 'SKUNK' : '2\u00d7 SKUNK'}</text>}
          </g>
        );
      })}

      {/* ghost pegs — previous spot of each pin, with a faint move trace */}
      {players.slice(0, n).map((pl, pi) => {
        if (pl.back == null || pl.back === pl.score) return null;
        const g = sbPos(pl.back, cfg);
        const p = sbPos(pl.score, cfg);
        return (
          <g key={'g' + pi}>
            <line x1={g.x + nudge[pi]} y1={g.y} x2={p.x + nudge[pi]} y2={p.y}
              stroke={t.cols[pi]} strokeWidth={1.5 * k} strokeOpacity="0.42"
              strokeDasharray={`${2 * k} ${3 * k}`} strokeLinecap="round" />
            <SBGhost x={g.x + nudge[pi]} y={g.y} r={5.5 * k} color={t.cols[pi]} />
          </g>
        );
      })}

      {/* live pins */}
      {players.slice(0, n).map((pl, pi) => {
        const p = sbPos(pl.score, cfg);
        return <SBPinFlag key={pi} x={p.x + nudge[pi]} y={p.y} color={t.cols[pi]}
          name={pl.name} score={pl.score} dir={dirs[pi]} k={k} />;
      })}
    </svg>
  );
}

Object.assign(window, { SwitchbackBoard });

</script>
<!-- ===== sb-screens.jsx ===== -->
<script type="text/babel" data-src="sb-screens.jsx">
/* ============================================================
   SWITCHBACK APP — screens & UI atoms.
   Reuses the Maplewood design vocabulary: quick +/- score buttons,
   peg pad, settings menu, dark mode. Adds the tournament flow
   (mode select → first-to-N → series standings → champion).
   ============================================================ */

const SB_SAFE_BOTTOM = 'calc(env(safe-area-inset-bottom, 0px) + 22px)';
const SB_FONT = "'Hanken Grotesk', sans-serif";
const SB_SERIF = "'Cormorant Garamond', serif";

/* HapticTap — wraps a control so a finger-tap lands on a real, invisible iOS
   <input switch> (the only thing that fires the Taptic Engine on iOS 26.5+),
   and also vibrates on Android. Visual is pointer-events:none; the switch carries
   the tap. UNITY: replace with Handheld.Vibrate / a Taptic plugin call. */
function HapticTap({ onTap, style, children, ariaLabel }) {
  return (
    <span style={{ position: 'relative', display: 'inline-flex', WebkitTapHighlightColor: 'transparent', ...style }}>
      <span style={{ pointerEvents: 'none', display: 'flex', width: '100%' }}>{children}</span>
      <input type="checkbox" tabIndex={-1} aria-label={ariaLabel || 'button'}
        ref={(el) => { if (el) el.setAttribute('switch', ''); }}
        onClick={() => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} if (onTap) onTap(); }}
        style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', margin: 0,
          opacity: 0, cursor: 'pointer', zIndex: 2 }} />
    </span>
  );
}

/* ---------- atoms ---------- */
function Dot({ c, size = 9, glow }) {
  return <span style={{ width: size, height: size, borderRadius: '50%', background: c,
    boxShadow: glow ? `0 0 8px ${c}` : `0 0 0 3px ${c}22`, flexShrink: 0 }} />;
}

function IconBtn({ t, children, size = 38, onClick }) {
  return (
    <div onClick={onClick} style={{ width: size, height: size, borderRadius: '50%', flexShrink: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
      WebkitTapHighlightColor: 'transparent', background: 'transparent',
      border: `1.5px solid ${t.line}`, color: t.ink2 }}>{children}</div>
  );
}

function MiniBtn({ t, label, onClick, danger }) {
  return (
    <button onClick={onClick} style={{ width: 34, height: 34, borderRadius: '50%', flexShrink: 0,
      border: `1.5px solid ${danger ? (t.dark ? 'rgba(224,99,74,0.5)' : 'rgba(181,72,47,0.4)') : t.line}`,
      background: 'transparent', cursor: 'pointer', padding: 0, fontFamily: SB_FONT,
      fontWeight: 700, fontSize: 12.5, color: danger ? (t.dark ? '#E0634A' : '#B5482F') : t.ink2,
      WebkitTapHighlightColor: 'transparent', display: 'flex', alignItems: 'center',
      justifyContent: 'center', transition: 'transform .08s' }}
      onPointerDown={(e) => (e.currentTarget.style.transform = 'scale(0.9)')}
      onPointerUp={(e) => (e.currentTarget.style.transform = '')}
      onPointerLeave={(e) => (e.currentTarget.style.transform = '')}>{label}</button>
  );
}

function Toggle({ t, on, accent }) {
  const a = accent || t.accent;
  return (
    <div style={{ width: 50, height: 30, borderRadius: 16, position: 'relative',
      background: on ? a : t.faint, transition: 'background .2s',
      border: on ? 'none' : `1px solid ${t.line}` }}>
      <span style={{ position: 'absolute', top: 3, left: on ? 23 : 3, width: 24, height: 24,
        borderRadius: '50%', background: t.dark ? '#15100A' : '#FBF7EE',
        boxShadow: '0 1px 3px rgba(0,0,0,0.3)', transition: 'left .2s' }} />
    </div>
  );
}

function MenuSection({ t, title, children, style = {} }) {
  return (
    <div style={{ marginBottom: 18, ...style }}>
      <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10, letterSpacing: '2px',
        textTransform: 'uppercase', color: t.ink2, marginBottom: 9, paddingLeft: 4 }}>{title}</div>
      <div style={{ background: t.surface, borderRadius: 16, border: `1px solid ${t.hairline}`,
        overflow: 'hidden', boxShadow: t.dark ? 'none' : '0 1px 2px rgba(43,38,32,0.05)' }}>{children}</div>

}

function Row({ t, children, last }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 15px',
      borderBottom: last ? 'none' : `1px solid ${t.hairline}` }}>{children}</div>
  );
}

/* series pips — filled = games won, ring = remaining */
function SeriesPips({ t, color, won, target, size = 11, gap = 6 }) {
  return (
    <div style={{ display: 'flex', gap, alignItems: 'center' }}>
      {Array.from({ length: target }, (_, i) => (
        <span key={i} style={{ width: size, height: size, borderRadius: '50%',
          background: i < won ? color : 'transparent',
          border: i < won ? 'none' : `1.5px solid ${t.line}`,
          boxShadow: i < won && t.dark ? `0 0 7px ${color}` : 'none', flexShrink: 0 }} />
      ))}
    </div>
  );
}

/* header back chevron */
function BackHead({ t, title, onBack }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', padding: '4px 20px 12px' }}>
      <div onClick={onBack} style={{ width: 36, height: 36, borderRadius: 11, background: t.surface,
        border: `1px solid ${t.hairline}`, display: 'flex', alignItems: 'center', cursor: 'pointer',
        justifyContent: 'center', color: t.ink2, fontSize: 18, WebkitTapHighlightColor: 'transparent' }}>{'\u2039'}</div>
      <div style={{ flex: 1, textAlign: 'center', fontFamily: SB_SERIF, fontStyle: 'italic',
        fontWeight: 500, fontSize: 22, color: t.ink, marginRight: 36 }}>{title}</div>
    </div>
  );
}

/* ---------- peg pad (arbitrary value bottom sheet) ---------- */
function PegPad({ t, player, color, onPeg, onClose }) {
  const quick = [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 16, 24];
  return (
    <div onClick={onClose} style={{ position: 'absolute', inset: 0, zIndex: 50,
      background: 'rgba(8,6,3,0.5)', display: 'flex', flexDirection: 'column',
      justifyContent: 'flex-end', animation: 'cc-fade .18s ease' }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: t.surface,
        borderTopLeftRadius: 28, borderTopRightRadius: 28, padding: `12px 22px ${SB_SAFE_BOTTOM}`,
        borderTop: `1px solid ${t.line}`, animation: 'cc-rise .24s cubic-bezier(.2,.8,.2,1)',
        boxShadow: '0 -18px 44px rgba(0,0,0,0.32)' }}>
        <div style={{ width: 40, height: 4, borderRadius: 4, background: t.faint, margin: '0 auto 18px' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
          <Dot c={color} size={12} glow={t.dark} />
          <span style={{ fontFamily: SB_SERIF, fontStyle: 'italic', fontWeight: 600, fontSize: 25,
            color: t.ink, whiteSpace: 'nowrap' }}>Peg for {player.name}</span>
          <div style={{ flex: 1 }} />
          <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 12, letterSpacing: '1.2px',
            color: t.ink2, whiteSpace: 'nowrap' }}>{player.score} pts</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 11 }}>
          {quick.map((n) => (
            <HapticTap key={n} onTap={() => onPeg(n)} ariaLabel={'plus ' + n}
              style={{ display: 'flex', width: '100%' }}>
              <span style={{ height: 60, width: '100%', borderRadius: 15,
                border: `1px solid ${t.line}`, background: t.surfaceAlt,
                fontFamily: SB_SERIF, fontWeight: 700, fontSize: 27, color: t.ink,
                display: 'flex', alignItems: 'center', justifyContent: 'center' }}>+{n}</span>
            </HapticTap>
          ))}
        </div>
        <button onClick={onClose} style={ghostBtn(t, { height: 50, marginTop: 18 })}>Cancel</button>
      </div>
    </div>
  );
}

/* ============================ SPLASH ============================ */

        </div>

/* ============================ MODE SELECT ============================ */
function ModeCard({ t, active, onClick, title, sub, icon }) {
  return (
    <button onClick={onClick} style={{ textAlign: 'left', cursor: 'pointer', width: '100%',
      display: 'flex', alignItems: 'center', gap: 14, padding: '16px 16px', borderRadius: 18,
      background: active ? (t.dark ? 'rgba(205,162,74,0.12)' : t.accentSoft) : t.surface,
      border: `1.5px solid ${active ? t.accent : t.hairline}`,
      WebkitTapHighlightColor: 'transparent', transition: 'background .15s, border-color .15s' }}>
      <span style={{ width: 42, height: 42, borderRadius: 12, flexShrink: 0, display: 'flex',
        alignItems: 'center', justifyContent: 'center', color: active ? t.accent : t.ink2,
        background: active ? (t.dark ? 'rgba(205,162,74,0.16)' : '#fff') : t.faint }}>{icon}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: SB_SERIF, fontWeight: 600, fontSize: 22, color: t.ink,
          lineHeight: 1.05 }}>{title}</div>
        <div style={{ fontFamily: SB_FONT, fontWeight: 500, fontSize: 12, color: t.ink2,
          marginTop: 2 }}>{sub}</div>
      </div>
      <span style={{ width: 22, height: 22, borderRadius: '50%', flexShrink: 0,
        border: `1.5px solid ${active ? t.accent : t.line}`, background: active ? t.accent : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {active && <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke={t.dark ? t.primaryFg : '#fff'}
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 6.2 5 8.5 9.5 3.5" /></svg>}
      </span>
    </button>

}

            icon={<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor"
              strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M6 19V3l9 3-9 3" /></svg>} />
          <ModeCard t={t} active={isTour} onClick={() => onFormat('tournament')}

              <path d="M11 12v4M8 19h6M9 19l.5-3h3l.5 3" /></svg>} />

          <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10, letterSpacing: '2px',
            textTransform: 'uppercase', color: t.ink2, margin: '24px 0 12px' }}>Win the series</div>
          <div style={{ display: 'flex', background: t.faint, borderRadius: 13, padding: 4, gap: 4 }}>
            {[3, 5, 7].map((n) => {
              const on = tourTarget === n;
              return (
                <button key={n} onClick={() => onTarget(n)} style={{ flex: 1, height: 60, borderRadius: 10,
                  border: 'none', cursor: 'pointer', background: on ? t.accent : 'transparent',
                  WebkitTapHighlightColor: 'transparent', display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center', gap: 1 }}>
                  <span style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 26, lineHeight: 1,
                    color: on ? (t.dark ? t.primaryFg : '#fff') : t.ink }}>{n}</span>
                  <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 8, letterSpacing: '1.4px',

      <div style={{ padding: `8px 26px ${SB_SAFE_BOTTOM}` }}>
        <button style={primaryBtn(t)} onClick={onContinue}>Continue</button>
      </div>

}

/* ============================ SETUP ============================ */
function SetupField({ t, value, placeholder, onChange, color, small }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
      {color && <Dot c={color} size={small ? 8 : 11} glow={t.dark} />}
      {small && !color && <span style={{ width: 14, flexShrink: 0 }} />}
      <input value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)}
        style={{ flex: 1, minWidth: 0, height: small ? 44 : 52, borderRadius: 13,
          border: `1px solid ${t.line}`, background: t.surface, padding: '0 15px',
          fontFamily: small ? SB_FONT : SB_SERIF, fontWeight: 600, fontSize: small ? 15 : 19,
          color: t.ink, outline: 'none', WebkitAppearance: 'none' }} />
    </div>
  );
}

function SBSetup({ t, g, onMode, onName, onMember, onStart, onBack }) {
  const counts = [2, 3, 4];
  return (
    <PhoneScreen bg={t.screen} style={{ overflow: 'hidden' }}>
      <BackHead t={t} title={g.format === 'tournament' ? `Tournament · First to ${g.tourTarget}` : 'Single Game'} onBack={onBack} />
      <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', padding: '2px 22px 10px' }}>
        <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10, letterSpacing: '2px',
          textTransform: 'uppercase', color: t.ink2, marginBottom: 10 }}>Players</div>
        <div style={{ display: 'flex', background: t.faint, borderRadius: 13, padding: 4, gap: 4 }}>
          {counts.map((m) => {
            const on = g.mode === m;
            return (
              <button key={m} onClick={() => onMode(m)} style={{ flex: 1, height: 44, borderRadius: 9,
                border: 'none', cursor: 'pointer', background: on ? t.accent : 'transparent',
                color: on ? (t.dark ? t.primaryFg : '#fff') : t.ink2, fontFamily: SB_FONT,
                fontWeight: 700, fontSize: 15, WebkitTapHighlightColor: 'transparent' }}>
                {m === 4 ? '4 · teams' : m}
              </button>
            );
          })}
        </div>
        <div style={{ fontFamily: SB_FONT, fontWeight: 500, fontSize: 11.5, color: t.ink2, marginTop: 9 }}>
          {g.mode === 4 ? 'Two teams of two — partners share one pin.'
                        : `Each of the ${g.mode} players climbs their own pin.`}
        </div>

        <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10, letterSpacing: '2px',
          textTransform: 'uppercase', color: t.ink2, margin: '24px 0 12px' }}>
          {g.mode === 4 ? 'Teams' : 'Names'}
        </div>

        {g.mode === 4 ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
            {g.players.map((tm, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                <SetupField t={t} value={tm.name} placeholder={`Team ${i + 1}`} color={t.cols[i]}
                  onChange={(v) => onName(i, v)} />
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingLeft: 4 }}>
                  {tm.members.map((mname, j) => (
                    <SetupField key={j} t={t} small value={mname}
                      placeholder={`Player ${i * 2 + j + 1}`} onChange={(v) => onMember(i, j, v)} />
                  ))}
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
            {g.players.map((pl, i) => (
              <SetupField key={i} t={t} value={pl.name} placeholder={`Player ${i + 1}`}
                color={t.cols[i]} onChange={(v) => onName(i, v)} />
            ))}
          </div>
        )}
      </div>
      <div style={{ padding: `8px 26px ${SB_SAFE_BOTTOM}` }}>
        <button style={primaryBtn(t)} onClick={onStart}>
          {g.format === 'tournament' ? 'Start Tournament' : 'Start Game'}
        </button>
      </div>
    </PhoneScreen>
  );
}

/* ============================ PLAY ============================ */
function ScoreRow({ t, g, pl, i, onAdjust, onOpenPad }) {
  const isTeam = !!pl.members;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '12px 2px',
      borderTop: i === 0 ? 'none' : `1px solid ${t.hairline}` }}>
      <Dot c={t.cols[i]} size={11} glow={t.dark} />
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 3 }}>
        <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 12, letterSpacing: '1.4px',
          textTransform: 'uppercase', color: t.ink, whiteSpace: 'nowrap', overflow: 'hidden',
          textOverflow: 'ellipsis' }}>{pl.name}</span>
        {isTeam ? (
          <span style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 9.5, color: t.ink2,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {pl.members.join(' & ')}{i === g.dealer ? '  ·  crib' : ''}</span>
        ) : (i === g.dealer && (
          <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 8, letterSpacing: '1.4px',
            textTransform: 'uppercase', color: t.accent, opacity: 0.9, whiteSpace: 'nowrap' }}>Dealer · crib</span>
        ))}
      </div>
      <span onClick={() => onOpenPad(i)} style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 32,
        lineHeight: 0.8, color: t.ink, letterSpacing: '-1px', marginRight: 2, cursor: 'pointer',
        WebkitTapHighlightColor: 'transparent' }}>{pl.score}</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexShrink: 0 }}>
        <MiniBtn t={t} label={'\u2212'} danger onClick={() => onAdjust(i, -1)} />
        <MiniBtn t={t} label="+1" onClick={() => onAdjust(i, 1)} />
        <MiniBtn t={t} label="+2" onClick={() => onAdjust(i, 2)} />
        <MiniBtn t={t} label="+3" onClick={() => onAdjust(i, 3)} />
      </div>
    </div>
  );
}

function SBPlay({ t, g, onAdjust, onOpenPad, onNextDeal, onUndo, onMenu }) {
  const crib = g.players[g.dealer];
  const isTour = g.format === 'tournament';
  /* His Heels: companion can't see the physical cut card, so this is a per-round
     prompt. If the cut was a Jack, the dealer pegs 2. Tap to claim, X to dismiss. */
  const [hhDoneRound, setHhDoneRound] = React.useState(0);
  const showHeels = hhDoneRound !== g.round;
  const claimHeels = () => { onAdjust(g.dealer, 2); setHhDoneRound(g.round); };
  return (
    <PhoneScreen bg={t.screen} style={{ overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '2px 18px 8px' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 3, flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, width: '100%', minWidth: 0 }}>
            <Dot c={t.cols[g.dealer]} size={9} glow={t.dark} />
            <span style={{ fontFamily: SB_SERIF, fontStyle: 'italic', fontWeight: 600, fontSize: 22,
              color: t.ink, lineHeight: 1.05, flex: 1, minWidth: 0, whiteSpace: 'nowrap',
              overflow: 'hidden', textOverflow: 'ellipsis' }}>{crib.name}&rsquo;s crib</span>
          </div>
          <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 9.5, letterSpacing: '1.8px',
            textTransform: 'uppercase', color: t.ink2, paddingLeft: 17 }}>
            {isTour ? `Game ${g.gameNo} · Round ${g.round}` : `Round ${g.round} · To 121`}
          </span>
        </div>
        <IconBtn t={t} onClick={onUndo}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8a5 5 0 1 1 1.5 3.5" /><path d="M3 4v4h4" /></svg>
        </IconBtn>
        <IconBtn t={t} onClick={onMenu}>
          <svg width="15" height="15" viewBox="0 0 16 16"><g fill="currentColor">
            <rect y="2" width="16" height="1.8" rx="0.9" /><rect y="7.1" width="16" height="1.8" rx="0.9" /><rect y="12.2" width="16" height="1.8" rx="0.9" /></g></svg>
        </IconBtn>
      </div>

      {/* His Heels — per-round prompt: Jack cut → dealer pegs 2 */}
      {showHeels && (
        <div style={{ margin: '0 16px 8px', padding: '6px 6px 6px 13px', borderRadius: 12,
          background: t.surface, border: `1px solid ${t.hairline}`, display: 'flex',
          alignItems: 'center', gap: 6 }}>
          <HapticTap onTap={claimHeels} ariaLabel="Claim His Heels for the dealer"
            style={{ flex: 1, minWidth: 0 }}>
            <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 11, letterSpacing: '0.3px',
              color: t.accent, lineHeight: 1.25, textAlign: 'left' }}>
              {'\u2666'} Jack cut? {crib.name} pegs His Heels &middot; +2
            </span>
          </HapticTap>
          <button onClick={() => setHhDoneRound(g.round)} aria-label="No Jack cut"
            style={{ background: 'none', border: 'none', cursor: 'pointer', color: t.ink2,
              fontSize: 14, lineHeight: 1, padding: '4px 7px', flexShrink: 0,
              WebkitTapHighlightColor: 'transparent' }}>{'\u2715'}</button>
        </div>
      )}

      {/* tournament series strip */}
      {isTour && (
        <div style={{ margin: '0 16px 6px', padding: '9px 13px', borderRadius: 13, background: t.surface,
          border: `1px solid ${t.hairline}`, display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 8.5, letterSpacing: '1.4px',
            textTransform: 'uppercase', color: t.accent, flexShrink: 0 }}>First to {g.tourTarget}</span>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6 }}>
            {g.players.map((pl, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10, letterSpacing: '0.5px',
                  color: t.ink2, width: 64, whiteSpace: 'nowrap', overflow: 'hidden',
                  textOverflow: 'ellipsis', flexShrink: 0 }}>{pl.name}</span>
                <SeriesPips t={t} color={t.cols[i]} won={g.wins[i] || 0} target={g.tourTarget} size={10} gap={5} />
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', WebkitOverflowScrolling: 'touch',
        display: 'flex', flexDirection: 'column', padding: '0 14px' }}>
        <div style={{ display: 'flex', justifyContent: 'center' }}>
          <div style={{ borderRadius: 24, padding: 0, width: 'fit-content',
            boxShadow: t.dark ? '0 18px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(205,162,74,0.14)'
                              : '0 16px 36px rgba(43,38,32,0.14)' }}>
            <SwitchbackBoard t={t} w={300} h={g.players.length >= 3 ? 410 : 432} players={g.players} />
          </div>
        </div>
        <div style={{ flex: 1, minHeight: 8 }} />
        <div style={{ padding: '4px 8px 10px' }}>
          {g.players.map((pl, i) => (
            <ScoreRow key={i} t={t} g={g} pl={pl} i={i} onAdjust={onAdjust} onOpenPad={onOpenPad} />
          ))}
        </div>
      </div>

      <div style={{ padding: `8px 22px ${SB_SAFE_BOTTOM}` }}>
        <button style={primaryBtn(t, { height: 54 })} onClick={onNextDeal}>Next Deal</button>
      </div>
    </PhoneScreen>
  );
}

/* ============================ SINGLE-GAME WIN ============================ */
function SBWin({ t, g, onRematch, onNew }) {
  const order = g.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.score - a.score);
  const winner = order[0], runner = order[1];
  const margin = winner.score - runner.score;
  const skunk = runner.score < 91;
  const wcol = t.cols[winner.i];
  const Stat = ({ n, l }) => (
    <div style={{ textAlign: 'center' }}>
      <div style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 26, color: t.ink, lineHeight: 1 }}>{n}</div>
      <div style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 8.5, letterSpacing: '1.4px',
        textTransform: 'uppercase', color: t.ink2, marginTop: 3 }}>{l}</div>
    </div>
  );
  return (
    <PhoneScreen bg={t.screen}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', padding: '0 32px', gap: 16 }}>
        <SuitRow size={18} color={t.accent} gap={12} style={{ opacity: t.dark ? 0.8 : 0.55 }} />
        <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 11, letterSpacing: '4px',
          textTransform: 'uppercase', color: t.dark ? t.accent : t.ink2 }}>{skunk ? 'Skunk!' : 'Summit'}</div>
        <div style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 56, lineHeight: 0.95,
          color: wcol, letterSpacing: '-0.5px', textAlign: 'center',
          textShadow: t.dark ? `0 0 40px ${wcol}66` : 'none' }}>{winner.name}</div>
        <div style={{ fontFamily: SB_SERIF, fontStyle: 'italic', fontWeight: 500, fontSize: 22,
          color: t.ink }}>reaches 121 first</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 4 }}>
          <Stat n={winner.score} l="Points" /><span style={{ width: 1, height: 30, background: t.faint }} />
          <Stat n={g.round} l="Rounds" /><span style={{ width: 1, height: 30, background: t.faint }} />
          <Stat n={margin} l="Margin" />
        </div>
        <SuitRow size={18} color={t.accent} gap={12} style={{ opacity: t.dark ? 0.8 : 0.55, marginTop: 4 }} />
      </div>
      <div style={{ padding: `0 26px ${SB_SAFE_BOTTOM}`, display: 'flex', flexDirection: 'column', gap: 11 }}>
        <button style={primaryBtn(t)} onClick={onRematch}>Rematch</button>
        <button style={ghostBtn(t)} onClick={onNew}>New Players</button>
      </div>
    </PhoneScreen>
  );
}

/* ============================ TOURNAMENT: GAME OVER / SERIES ============================ */
function SBSeries({ t, g, onNext }) {
  const wi = g.lastWinner;
  const winner = g.players[wi];
  const wcol = t.cols[wi];
  const order = g.players.map((p, i) => ({ ...p, i, won: g.wins[i] || 0 }))
    .sort((a, b) => b.won - a.won || b.score - a.score);
  const leader = order[0];
  const ahead = order.length > 1 ? leader.won - order[1].won : leader.won;
  return (
    <PhoneScreen bg={t.screen} style={{ overflow: 'hidden' }}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center',
        padding: '0 30px', gap: 18, overflowY: 'auto' }}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 10.5, letterSpacing: '3.5px',
            textTransform: 'uppercase', color: t.ink2 }}>Game {g.gameNo} won by</div>
          <div style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 48, lineHeight: 1.02,
            color: wcol, marginTop: 6, textShadow: t.dark ? `0 0 36px ${wcol}55` : 'none' }}>{winner.name}</div>
        </div>

        <div style={{ background: t.surface, borderRadius: 18, border: `1px solid ${t.hairline}`,
          padding: '6px 16px', boxShadow: t.dark ? 'none' : '0 1px 2px rgba(43,38,32,0.05)' }}>
          {order.map((p, idx) => (
            <div key={p.i} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '13px 0',
              borderTop: idx === 0 ? 'none' : `1px solid ${t.hairline}` }}>
              <Dot c={t.cols[p.i]} size={11} glow={t.dark} />
              <span style={{ flex: 1, fontFamily: SB_SERIF, fontWeight: 600, fontSize: 21, color: t.ink,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.name}</span>
              <SeriesPips t={t} color={t.cols[p.i]} won={p.won} target={g.tourTarget} />
              <span style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 26, color: t.ink,
                width: 26, textAlign: 'right' }}>{p.won}</span>
            </div>
          ))}
        </div>

        <div style={{ fontFamily: SB_FONT, fontWeight: 500, fontSize: 13, color: t.ink2,
          textAlign: 'center', lineHeight: 1.5 }}>
          First to <strong style={{ color: t.ink }}>{g.tourTarget}</strong>.{' '}
          {leader.won >= g.tourTarget ? 'Series decided.'
            : ahead === 0 ? 'All square — next game breaks the tie.'
            : <span><strong style={{ color: t.cols[leader.i] }}>{leader.name}</strong> needs {g.tourTarget - leader.won} more.</span>}
        </div>
      </div>
      <div style={{ padding: `8px 26px ${SB_SAFE_BOTTOM}` }}>
        <button style={primaryBtn(t)} onClick={onNext}>Next Game · Game {g.gameNo + 1}</button>
      </div>
    </PhoneScreen>
  );
}

/* ============================ TOURNAMENT CHAMPION ============================ */
function SBChampion({ t, g, onNewTour, onNew }) {
  const wi = g.lastWinner;
  const champ = g.players[wi];
  const wcol = t.cols[wi];
  const order = g.players.map((p, i) => ({ ...p, i, won: g.wins[i] || 0 }))
    .sort((a, b) => b.won - a.won);
  const runner = order[1];
  return (
    <PhoneScreen bg={t.screen}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', padding: '0 32px', gap: 14 }}>
        <span style={{ color: t.accent }}>
          <svg width="50" height="50" viewBox="0 0 48 48" fill="none" stroke="currentColor"
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M13 6h22v9a11 11 0 0 1-22 0V6Z" /><path d="M13 10H6v2a7 7 0 0 0 7 7M35 10h7v2a7 7 0 0 1-7 7" />
            <path d="M24 26v9M16 42h16M18 42l1-6h10l1 6" /></svg>
        </span>
        <div style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 11, letterSpacing: '4px',
          textTransform: 'uppercase', color: t.dark ? t.accent : t.ink2 }}>Tournament Champion</div>
        <div style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 58, lineHeight: 0.95,
          color: wcol, letterSpacing: '-0.5px', textAlign: 'center',
          textShadow: t.dark ? `0 0 44px ${wcol}66` : 'none' }}>{champ.name}</div>
        <div style={{ fontFamily: SB_SERIF, fontStyle: 'italic', fontWeight: 500, fontSize: 22,
          color: t.ink }}>takes the series</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 6 }}>
          <span style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 38, color: wcol }}>{champ.won}</span>
          <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 15, color: t.ink2 }}>—</span>
          <span style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 38, color: t.ink2 }}>{runner ? runner.won : 0}</span>
        </div>
        <div style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 11, letterSpacing: '0.5px',
          color: t.ink2 }}>{g.gameNo} {g.gameNo === 1 ? 'game' : 'games'} played · first to {g.tourTarget}</div>
      </div>
      <div style={{ padding: `0 26px ${SB_SAFE_BOTTOM}`, display: 'flex', flexDirection: 'column', gap: 11 }}>
        <button style={primaryBtn(t)} onClick={onNewTour}>New Tournament</button>
        <button style={ghostBtn(t)} onClick={onNew}>New Players</button>
      </div>
    </PhoneScreen>
  );
}

/* ============================ MENU ============================ */
function SBMenu({ t, g, onBack, onToggleDark, onChangePlayers, onNewGame, onEndTour }) {
  const dark = t.dark;
  const isTour = g.format === 'tournament';
  return (
    <PhoneScreen bg={t.screen} style={{ overflow: 'hidden' }}>
      <BackHead t={t} title="Game Settings" onBack={onBack} />
      <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', padding: '4px 18px 0' }}>
        {isTour && (
          <MenuSection t={t} title={`Tournament · First to ${g.tourTarget}`}>
            {g.players.map((pl, i) => (
              <Row key={i} t={t} last={i === g.players.length - 1}>
                <Dot c={t.cols[i]} glow={dark} />
                <span style={{ flex: 1, minWidth: 0, fontFamily: SB_SERIF, fontWeight: 600, fontSize: 21,
                  color: t.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{pl.name}</span>
                <SeriesPips t={t} color={t.cols[i]} won={g.wins[i] || 0} target={g.tourTarget} />
                <span style={{ fontFamily: SB_SERIF, fontWeight: 700, fontSize: 22, color: t.ink,
                  width: 22, textAlign: 'right' }}>{g.wins[i] || 0}</span>
              </Row>
            ))}
          </MenuSection>
        )}

        <MenuSection t={t} title="Players">
          {g.players.map((pl, i) => (
            <Row key={i} t={t} last={i === g.players.length - 1}>
              <Dot c={t.cols[i]} glow={dark} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: SB_SERIF, fontWeight: 600, fontSize: 21, color: t.ink,
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{pl.name}</div>
                {pl.members && (
                  <div style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 11, color: t.ink2 }}>{pl.members.join(' & ')}</div>
                )}
              </div>
              {i === g.dealer
                ? <span style={{ fontFamily: SB_FONT, fontWeight: 700, fontSize: 8.5, letterSpacing: '1.2px',
                    color: dark ? t.primaryFg : t.accent, background: dark ? t.accent : t.accentSoft,
                    padding: '3px 8px', borderRadius: 20, textTransform: 'uppercase' }}>Dealer</span>
                : <span style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 13, color: t.ink2 }}>{pl.score} pts</span>}
            </Row>
          ))}
        </MenuSection>

        <button style={ghostBtn(t, { height: 48 })} onClick={onChangePlayers}>Change players &amp; names</button>

        <MenuSection t={t} title="Appearance" style={{ marginTop: 20 }}>
          <div onClick={onToggleDark} style={{ cursor: 'pointer', WebkitTapHighlightColor: 'transparent' }}>
            <Row t={t} last>
              <span style={{ width: 30, height: 30, borderRadius: 9, display: 'flex', alignItems: 'center',
                justifyContent: 'center', background: dark ? 'rgba(205,162,74,0.14)' : t.accentSoft, color: t.accent }}>
                {dark
                  ? <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z" /></svg>
                  : <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><circle cx="8" cy="8" r="3" /><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13" strokeLinecap="round" /></svg>}
              </span>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: SB_FONT, fontWeight: 600, fontSize: 14, color: t.ink }}>Dark mode</div>
                <div style={{ fontFamily: SB_FONT, fontWeight: 500, fontSize: 11, color: t.ink2 }}>{dark ? 'Walnut — easy on evening eyes' : 'Maple — bright daylight'}</div>
              </div>
              <Toggle t={t} on={dark} accent={dark ? t.accent : undefined} />
            </Row>
          </div>
        </MenuSection>
      </div>

      <div style={{ padding: `6px 26px ${SB_SAFE_BOTTOM}`, display: 'flex', flexDirection: 'column', gap: 11 }}>
        <button style={primaryBtn(t, { height: 52 })} onClick={onBack}>Resume Game</button>
        <button style={ghostBtn(t)} onClick={isTour ? onEndTour : onNewGame}>{isTour ? 'End Tournament' : 'End & New Game'}</button>
      </div>
    </PhoneScreen>
  );
}

Object.assign(window, {
  SBSplash, SBModeSelect, SBSetup, SBPlay, SBWin, SBSeries, SBChampion, SBMenu, PegPad,
});

</script>
<!-- ===== sb-app.jsx ===== -->
<script type="text/babel" data-src="sb-app.jsx">
/* ============================================================
   SWITCHBACK APP — controller. Owns game + tournament state,
   persistence, and the screen router.
   Screens: splash · mode · setup · play · menu · win · series · champion
   ============================================================ */

const { useState, useEffect } = React;
const SB_STORE = 'cribbage-switchback.v1';

function sbMakePlayers(mode) {
  if (mode === 4) {
    return [0, 1].map((i) => ({
      name: `Team ${i + 1}`, members: [`Player ${i * 2 + 1}`, `Player ${i * 2 + 2}`],
      score: 0, back: 0,
    }));
  }
  return Array.from({ length: mode }, (_, i) => ({ name: `Player ${i + 1}`, score: 0, back: 0 }));
}

function sbFresh() {
  return {
    screen: 'splash',
    dark: false,
    format: 'single',     // 'single' | 'tournament'
    tourTarget: 3,        // 3 | 5 | 7
    mode: 2,
    round: 1,
    dealer: 0,
    gameNo: 1,
    players: sbMakePlayers(2),
    wins: [0, 0],
    lastWinner: 0,
    history: [],
  };
}

function sbLoad() {
  try {
    const raw = localStorage.getItem(SB_STORE);
    if (raw) return Object.assign(sbFresh(), JSON.parse(raw));
  } catch (e) {}
  return sbFresh();
}

function SwitchbackApp() {
  const [g, setG] = useState(sbLoad);
  const t = g.dark ? DARK : LIGHT;
  const [pegFor, setPegFor] = useState(null);

  useEffect(() => {
    const { history, ...persist } = g;
    try { localStorage.setItem(SB_STORE, JSON.stringify(persist)); } catch (e) {}
  }, [g]);

  /* Android haptic: a short tick on any <button> tap. No-op on iOS (no vibrate API);
     iOS haptic is handled per-control by HapticTap's native switch overlay. */
  useEffect(() => {
    function tick(e) {
      const el = e.target;
      if (el && el.closest && el.closest('button')) {
        try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
      }
    }
    document.addEventListener('pointerdown', tick, true);
    return () => document.removeEventListener('pointerdown', tick, true);
  }, []);

  function snapshot(s) {
    return { round: s.round, dealer: s.dealer, players: s.players.map((p) => ({ ...p })) };
  }
  function go(screen) { setG((s) => ({ ...s, screen })); }

  /* ---- new-game / mode flow ---- */
  function newGame() { setG((s) => ({ ...sbFresh(), dark: s.dark, screen: 'mode' })); setPegFor(null); }
  function setFormat(format) { setG((s) => ({ ...s, format })); }
  function setTarget(tourTarget) { setG((s) => ({ ...s, tourTarget })); }
  function continueToSetup() { go('setup'); }

  /* ---- setup ---- */
  function setMode(m) {
    setG((s) => {
      const prev = s.players;
      let players;
      if (m === 4) {
        players = [0, 1].map((i) => ({
          name: (prev[i] && prev[i].members) ? prev[i].name : `Team ${i + 1}`,
          members: (prev[i] && prev[i].members) ? prev[i].members.slice() : [`Player ${i * 2 + 1}`, `Player ${i * 2 + 2}`],
          score: 0, back: 0,
        }));
      } else {
        players = Array.from({ length: m }, (_, i) => ({
          name: (prev[i] && !prev[i].members) ? prev[i].name : `Player ${i + 1}`,
          score: 0, back: 0,
        }));
      }
      return { ...s, mode: m, players, wins: players.map(() => 0) };
    });
  }
  function setName(i, v) {
    setG((s) => { const players = s.players.map((p) => ({ ...p })); players[i].name = v; return { ...s, players }; });
  }
  function setMember(i, j, v) {
    setG((s) => { const players = s.players.map((p) => ({ ...p, members: p.members ? p.members.slice() : p.members }));
      players[i].members[j] = v; return { ...s, players }; });
  }
  function startGame() {
    setG((s) => {
      const players = s.players.map((p, i) => {
        const name = (p.name || '').trim() || (p.members ? `Team ${i + 1}` : `Player ${i + 1}`);
        const out = { ...p, name, score: 0, back: 0 };
        if (p.members) out.members = p.members.map((m, j) => (m || '').trim() || `Player ${i * 2 + j + 1}`);
        return out;
      });
      return { ...s, players, wins: players.map(() => 0), gameNo: 1,
        screen: 'play', round: 1, dealer: 0, history: [] };
    });
  }

  /* ---- scoring ---- */
  function adjust(i, delta) {
    setG((s) => {
      const players = s.players.map((p) => ({ ...p }));
      const p = players[i];
      const old = p.score;
      const newScore = Math.max(0, Math.min(121, p.score + delta));
      if (delta > 0) { p.back = p.score; p.score = newScore; }
      else { p.score = newScore; if (p.back > newScore) p.back = newScore; }
      const history = [...s.history, snapshot(s)].slice(-40);
      const won = old < 121 && newScore >= 121;
      if (!won) return { ...s, players, history };
      if (s.format !== 'tournament') return { ...s, players, history, screen: 'win' };
      const wins = s.wins.slice(); wins[i] = (wins[i] || 0) + 1;
      const champ = wins[i] >= s.tourTarget;
      return { ...s, players, history, wins, lastWinner: i, screen: champ ? 'champion' : 'series' };
    });
    setPegFor(null);
  }
  function nextDeal() {
    setG((s) => ({ ...s, round: s.round + 1, dealer: (s.dealer + 1) % s.players.length,
      history: [...s.history, snapshot(s)].slice(-40) }));
  }
  function undo() {
    setG((s) => {
      if (!s.history.length) return s;
      const prev = s.history[s.history.length - 1];
      return { ...s, ...prev, history: s.history.slice(0, -1) };
    });
  }

  /* ---- single-game end actions ---- */
  function rematch() {
    setG((s) => ({ ...s, screen: 'play', round: 1, dealer: 0, history: [],
      players: s.players.map((p) => ({ ...p, score: 0, back: 0 })) }));
    setPegFor(null);
  }

  /* ---- tournament transitions ---- */
  function nextGame() {
    setG((s) => {
      const nP = s.players.length;
      return { ...s, screen: 'play', round: 1, dealer: s.gameNo % nP, gameNo: s.gameNo + 1,
        players: s.players.map((p) => ({ ...p, score: 0, back: 0 })), history: [] };
    });
    setPegFor(null);
  }
  function newTournament() {
    setG((s) => ({ ...s, screen: 'play', round: 1, dealer: 0, gameNo: 1, history: [],
      wins: s.players.map(() => 0), players: s.players.map((p) => ({ ...p, score: 0, back: 0 })) }));
    setPegFor(null);
  }

  let screen;
  if (g.screen === 'splash') {
    const resumable = g.gameNo > 1 || g.round > 1 || g.players.some((p) => p.score > 0) || g.wins.some((w) => w > 0);
    screen = <SBSplash t={t} onNew={newGame} canResume={resumable}
      resumeLabel={g.format === 'tournament' ? `Resume Tournament` : 'Resume Game'}
      onResume={() => go('play')} />;
  } else if (g.screen === 'mode') {
    screen = <SBModeSelect t={t} format={g.format} tourTarget={g.tourTarget}
      onFormat={setFormat} onTarget={setTarget} onContinue={continueToSetup} onBack={() => go('splash')} />;
  } else if (g.screen === 'setup') {
    screen = <SBSetup t={t} g={g} onMode={setMode} onName={setName} onMember={setMember}
      onStart={startGame} onBack={() => go('mode')} />;
  } else if (g.screen === 'menu') {
    screen = <SBMenu t={t} g={g} onBack={() => go('play')} onNewGame={newGame}
      onEndTour={newGame} onChangePlayers={() => go('setup')}
      onToggleDark={() => setG((s) => ({ ...s, dark: !s.dark }))} />;
  } else if (g.screen === 'win') {
    screen = <SBWin t={t} g={g} onRematch={rematch} onNew={newGame} />;
  } else if (g.screen === 'series') {
    screen = <SBSeries t={t} g={g} onNext={nextGame} />;
  } else if (g.screen === 'champion') {
    screen = <SBChampion t={t} g={g} onNewTour={newTournament} onNew={newGame} />;
  } else {
    screen = <SBPlay t={t} g={g} onAdjust={adjust} onOpenPad={(i) => setPegFor(i)}
      onNextDeal={nextDeal} onUndo={undo} onMenu={() => go('menu')} />;
  }

  return (
    <div className="cc-stage" style={{ background: g.dark ? '#0B0805' : '#D9CFBA' }}>
      <div className="cc-device" style={{ background: t.screen, boxShadow: g.dark
        ? '0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(205,162,74,0.12)'
        : '0 30px 80px rgba(43,38,32,0.28)' }}>
        {screen}
        {pegFor !== null && g.players[pegFor] && (
          <PegPad t={t} player={g.players[pegFor]} color={t.cols[pegFor]}
            onPeg={(n) => adjust(pegFor, n)} onClose={() => setPegFor(null)} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SwitchbackApp />);

</script>
</body>
